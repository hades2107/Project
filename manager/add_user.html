<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="register_form.css">
</head>
<body>
        <form action="add_user_controller.php" method="post">
            <fieldset>
                <legend>Add User</legend>
                <input name="username" placeholder="Fullname" type="text" required>
                <input name="email" placeholder="Email" type="email" required>
                <input name="password" placeholder="Password" type="password" required>
                <select name="role" id="role" required>
                    <option style="text-align: center; color: red;">---Select Role---</option>
                    <option value="Agent">Agent</option>
                    <option value="Manager">Manager</option>
                </select>
                <input id="btn" name="add" value="Add User" type="submit">
            </fieldset>

        </form>  
</body>
</html>
